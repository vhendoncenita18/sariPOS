<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Reset your SariPOS password</title>
  </head>
  <body>
    <main>
      <h1>Reset your SariPOS password</h1>
      <p>Use this code to reset your SariPOS password:</p>
      <p><strong style="font-size: 2rem; letter-spacing: 0.25rem">{{ .Token }}</strong></p>
      <p>This code expires in 10 minutes. Enter it in SariPOS to choose a new password. Never share it with anyone.</p>
      <p>If you didn't request this reset, you can ignore this email.</p>
    </main>
  </body>
</html>
